# Идентификаторы заданий и шагов — латиницей: GitHub Actions принимает только
# [A-Za-z_][A-Za-z0-9_-]*. Названия для человека остаются по-русски.

name: Проверка

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Типы, тесты и сборка
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Весь код в репозитории
        run: npm run check:tracked

      - name: Контраст текста
        run: npm run check:contrast

      - name: Шкала размеров
        run: npm run check:scale

      - name: Статическая проверка
        run: npm run lint

      - name: Проверка типов
        run: npm run typecheck

      - name: Модульные тесты
        run: npm test

      - name: Сборка
        run: npm run build
